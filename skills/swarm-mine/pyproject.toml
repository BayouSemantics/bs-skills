[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bs-swarm-mine"
version = "0.1.0"
description = "Local asset mining, qualification, and source registry"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.11,<3", "httpx>=0.27,<1", "pymupdf>=1.24,<2"]

[project.optional-dependencies]
text-classifier = ["scikit-learn>=1.5,<2", "joblib>=1.3,<2"]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "pyyaml>=6,<7"]

[tool.setuptools.packages.find]
where = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
